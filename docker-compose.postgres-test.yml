services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres-test
    env_file:
      - ./docker/postgres-test.env
    ports:
      - "5432:5432"
    volumes:
      - hr_postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/01-init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  hr_postgres_test_data:
